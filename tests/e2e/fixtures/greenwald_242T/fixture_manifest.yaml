fixture_id: greenwald_242T_two_pairs
purpose: |
  Real-data E2E acceptance fixture for the TileScope canonical ROI-grain
  exports. Included so the integration tests run
  without requiring a TileScope-data checkout. This is IMMUTABLE test
  input; the scientific source authority remains TileScope-data.

source:
  cohort: Greenwald 2024 — heiland_tyrosh preprocessed cohort
  sample: 242_T
  source_root: TileScope-data/heiland_tyrosh
  provenance_scope: |
    The CSVs vendored here are byte-identical copies of the
    heiland_tyrosh preprocessed cohort files (see `source_sha256` per
    file below). They are NOT necessarily byte-identical to the raw
    published Greenwald Visium tables — the preprocessing pipeline in
    heiland_tyrosh produced a `(x, y, gene1, gene2, roi_id)` schema
    that both TileScope and this analysis repository consume directly.
  citation: |
    Greenwald AC et al. (2024) Integrative spatial analysis reveals a
    multi-layered organization of glioblastoma. Cell 187(10):2485-2501.
  upstream_accession: |
    The exact upstream release URL and per-sample accession were not
    recorded when this fixture was created and have not been resolved
    in this manifest. The study citation above does not replace them.
  redistribution: |
    Redistribution basis for the raw Greenwald 2024 Visium data was
    not documented in TileScope-data at fixture-creation time and has
    not been independently verified. The vendored files are used
    solely as test input in TileScope-results. Their inclusion does not
    establish permission for redistribution; the applicable license
    remains unverified.

selection_rationale: |
  242_T was selected for geometry / identity complexity, not biological
  interest. Six source ROIs, at least one parent that splits into
  multiple analysis components under the standard component-domain
  contract — this exercises sibling-component pooling in every
  ROI-grain builder (correlation + enrichment + Moran) and genuine
  other-ROI enrichment context. Two pairs give an A/B check that
  spot-ledger and component-geometry are stable across gene pairs
  with identical (x, y, roi_id) support.

