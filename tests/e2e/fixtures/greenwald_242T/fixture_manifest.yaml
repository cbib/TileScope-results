  - name: run.config.json
    role: tilescope_run_config
    source_relative: CONFIGs/242_T/run.config.json
    source_sha256: 6e89bcb174bcb07a8facb9046b3f60fdb8e7d9d9c4b154ac0bcc308c0fc2f53f
    fixture_sha256: 25fe7ed347eaf8a9fc8ba4b1303648fb7dc17297d29319b3083885b3f2961442
    sanitization: |
      The vendored file has been sanitized once and committed as the
      schema-valid current-core snapshot; the runner passes it
      directly, without modifying configuration keys at runtime.

      Sanitization applied at fixture creation:

      - Metadata keys removed: `_comment`, `_version`, `_metadata`,
        `output_dir` (not schema fields).
      - Retired sections removed: `hull`, `hull_adaptive` — the
        alpha / mask polygonization pipeline they parameterised was
        replaced by TileScope's
        `bounded_spot_support_owned_acquisition` geometry contract;
        the loader raises `ConfigMigrationError` if these survive
        into a run.

      Every other key is preserved verbatim from the source snapshot.

invariants:
  # Structural properties the runner asserts. Anything here should be
  # verifiable directly from the fixture content, not from TileScope
  # outputs.
  same_support_across_pairs: |
    Both CSVs share the same (x, y, roi_id) support; only gene1 /
    gene2 differ. Verified by ledger row count equality per pair and
    identical per-ROI n across the two pairs (see per_roi_n above).
  multi_component_expected: |
    At least one parent ROI is expected to split into more than one
    analysis component under the standard configuration. The E2E test
    asserts this from the emitted spot_ledger.csv.

