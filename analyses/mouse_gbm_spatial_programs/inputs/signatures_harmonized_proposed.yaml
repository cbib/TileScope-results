status: proposed_not_frozen
selection_authority: predeclared focus ROIs plus source-expression and score-level
  audits; no TileScope pair outcome selected genes
scoring_contract:
  multi_gene:
    method: Seurat::AddModuleScore
    assay: Spatial
    layer: data
    nbin: 24
    ctrl: 50
    seed: 1234
    pool: full Spatial assay feature set
    invocation: each panel scored separately
  single_gene: LogNormalized Spatial/data expression; never called a programme
  raw_panel_control: unweighted mean of LogNormalized member-gene expression
  comparison_scope: within sample and focus ROI only; no absolute cross-sample score
    comparisons
scope_rule:
  definition_focus:
    MCT1_CTL:
    - 2
    - 5
    MCT1_KO:
    - 4
    - 9
    V4_WT:
    - 10
    - 2
    - 1
  portability: CTL and KO always use identical genes per topic; V4 uses the same panel
    where constructable, plus one explicitly V4-specific reactive-interface program.
programs:
- program: cell_cycle_proliferation
  candidate: proliferation_current
  use_scope: MCT1_CTL, MCT1_KO and V4_WT
  kind: biological_program
  decision: Keep the established five-gene panel; it is more leave-one-out robust
    than the compact panel and exactly preserves the previous IFN-proliferation analysis.
  topic: Cell-cycle and proliferation
  genes:
  - Cdk1
  - Birc5
  - Top2a
  - Mki67
  - Mcm5
  definition_scope: all_samples
  score_method: Seurat::AddModuleScore after panel freeze
  audit:
    n_focus_contexts: 7
    minimum_score_raw_spearman: 0.946794484401908
    minimum_loo_spearman: 0.874611335530885
    score_raw_contrast_sign_agreement: 1.0
    minimum_gene_detection: 0.245901639344262
    mean_pairwise_codetection: 0.6301153482038859
    minimum_component_coverage: 0.5
