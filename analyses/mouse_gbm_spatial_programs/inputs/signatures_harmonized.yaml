  note: The workbook is a review artefact; this YAML is the durable execution contract.
scoring_rule:
  method: Seurat::AddModuleScore
  assay: Spatial
  layer: data
  expression_transform: LogNormalize with scale.factor=10000
  gene_pool_for_control_bins: full Spatial assay feature set
  nbin: 24
  ctrl: 50
  seed: 1234
  invocation: score each signature separately, once per sample, then reuse across every pair
  post_score_transforms: none
  cross_sample_comparison: do not compare absolute AddModuleScore magnitudes across samples
  unavailability_rule: fail if any required gene is missing or invariant; never silently shrink a signature
